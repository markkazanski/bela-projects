name: pepper-grids-clone-tests
on:
  push:
    paths:
      - "pepper-grids-clone/**"
      - ".github/workflows/pepper-grids-clone.yml"
  pull_request:
    paths:
      - "pepper-grids-clone/**"
      - ".github/workflows/pepper-grids-clone.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and test
        working-directory: pepper-grids-clone
        run: |
          rm -rf build-ci
          cmake -S test -B build-ci
          cmake --build build-ci
          ctest --test-dir build-ci --output-on-failure
